<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracking</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>GPS Tracking</h1>
        <p>Lacak lokasi perangkat Anda secara real-time</p>
    </div>

    <div class="container">
        <!-- Panel Kontrol -->
        <div class="card">
            <h2>Kontrol Tracking</h2>
            <div class="controls">
                <button id="startBtn" onclick="startTracking()">Start Tracking</button>
                <button id="stopBtn" onclick="stopTracking()" disabled>Stop Tracking</button>
            </div>

            <div class="status-box">
                <p>Status: <span id="status" class="status-text inactive">Non-aktif</span></p>
            </div>

            <!-- Informasi Koordinat -->
            <div class="info-grid">
                <div class="info-item">
                    <label>Latitude</label>
                    <span id="lat">-</span>
                </div>
                <div class="info-item">
                    <label>Longitude</label>
                    <span id="lng">-</span>
                </div>
                <div class="info-item">
                    <label>Akurasi</label>
                    <span id="accuracy">-</span>
                </div>
                <div class="info-item">
                    <label>Kecepatan</label>
                    <span id="speed">-</span>
                </div>
            </div>

            <!-- Log Riwayat Lokasi -->
            <h3>Log Pergerakan</h3>
            <div class="log-container" id="logBox">
                <p style="color: #888;">Belum ada data lokasi.</p>
            </div>
        </div>
        <div class="card">
            <h2>Peta Real-Time</h2>
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Script Tracking & Map -->
    <script>
        let map, marker, pathLine;
        let watchId = null;
        let pathCoordinates = [];

        // Inisialisasi Peta Leaflet
        function initMap() {
            // Default center ke Jakarta
            map = L.map('map').setView([-6.2088, 106.8456], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            pathLine = L.polyline([], { color: '#2563eb', weight: 4 }).addTo(map);
        }

        // Mulai Pelacakan
        function startTracking() {
            if (!navigator.geolocation) {
                alert("Geolocation tidak didukung oleh browser Anda.");
                return;
            }

            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            
            const statusEl = document.getElementById('status');
            statusEl.textContent = "Aktif (Mencari Sinyal...)";
            statusEl.className = "status-text active";

            // Mengambil lokasi secara periodik
            watchId = navigator.geolocation.watchPosition(
                onSuccess, 
                onError, 
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // Berhentikan Pelacakan
        function stopTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;

            const statusEl = document.getElementById('status');
            statusEl.textContent = "Non-aktif";
            statusEl.className = "status-text inactive";
            
            addLog("Tracking dihentikan.");
        }

        // Callback ketika berhasil mendapatkan koordinat
        function onSuccess(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy.toFixed(1) + " meter";
            const speed = position.coords.speed ? (position.coords.speed * 3.6).toFixed(1) + " km/jam" : "0 km/jam";

            // Update UI Info
            document.getElementById('lat').textContent = lat.toFixed(6);
            document.getElementById('lng').textContent = lng.toFixed(6);
            document.getElementById('accuracy').textContent = accuracy;
            document.getElementById('speed').textContent = speed;

            const currentLatLng = [lat, lng];

            // Update atau Tambahkan Marker di Peta
            if (!marker) {
                marker = L.marker(currentLatLng).addTo(map)
                    .bindPopup("Lokasi Anda saat ini").openPopup();
            } else {
                marker.setLatLng(currentLatLng);
            }

            // Tambahkan koordinat ke jalur lintasan
            pathCoordinates.push(currentLatLng);
            pathLine.setLatLngs(pathCoordinates);
            map.panTo(currentLatLng);

            addLog(`Posisi: ${lat.toFixed(5)}, ${lng.toFixed(5)} (Akurasi: ${accuracy})`);

            // Kirim data ke backend PHP
            sendDataToBackend(lat, lng, position.coords.speed, position.coords.accuracy);
        }

        // Callback ketika gagal mendapat koordinat
        function onError(error) {
            let errorMsg = "Gagal mengambil lokasi.";
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    errorMsg = "Izin akses lokasi ditolak.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    errorMsg = "Informasi lokasi tidak tersedia.";
                    break;
                case error.TIMEOUT:
                    errorMsg = "Waktu permintaan lokasi habis.";
                    break;
            }
            addLog(`Error: ${errorMsg}`);
        }

        // Fungsi mencatat log di UI
        function addLog(text) {
            const logBox = document.getElementById('logBox');
            const time = new Date().toLocaleTimeString('id-ID');
            const logItem = document.createElement('div');
            logItem.className = 'log-item';
            logItem.innerHTML = `<span class="time">[${time}]</span> ${text}`;
            
            if (logBox.children.length === 1 && logBox.children[0].tagName === 'P') {
                logBox.innerHTML = '';
            }
            
            logBox.prepend(logItem);
        }

        // Fungsi Ajax POST ke PHP Server
        function sendDataToBackend(lat, lng, speed, accuracy) {
            fetch('save_location.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `latitude=${lat}&longitude=${lng}&speed=${speed || 0}&accuracy=${accuracy}`
            })
            .then(res => res.json())
            .then(data => {
                console.log('Tersimpan di PHP Server:', data);
            })
            .catch(err => {
                console.error('Gagal mengirim ke PHP:', err);
            });
        }

        // Jalankan peta saat halaman pertama dimuat
        window.onload = initMap;
    </script>
</body>
</html>
